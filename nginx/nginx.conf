# Serves the built Angular frontend and proxies the API/WebSocket to the backend.
#
# Docker Compose mounts the build output at /usr/share/nginx/html and reaches
# the backend by service name.  Running nginx on the host instead? Point `root`
# at frontend/dist/frontend/browser and change the upstream to 127.0.0.1:28819.

upstream ueba_backend {
    server ueba-backend:28819;
}

server {
    listen 28818;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://ueba_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://ueba_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
